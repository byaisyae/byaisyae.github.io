name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # pakai "npm ci" jika package-lock.json sudah di-commit
      - run: npm install
      - run: npm run build
        env:
          # opsional: atur di Settings → Secrets and variables → Actions → Variables
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # URL Web App Google Apps Script (testimoni + dashboard admin; lihat apps-script/SETUP.md)
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_KOLEKSI_API_URL: ${{ vars.VITE_KOLEKSI_API_URL }} # nama lama, tetap didukung
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
